[package]
name = "mpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Autonomous Ligue 1 predictions for Mon Petit Prono"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
