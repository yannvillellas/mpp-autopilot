name: mpp-autopilot

services:
  mpp-autopilot:
    build: .
    image: mpp-autopilot:latest
    container_name: mpp-autopilot
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - .env
    environment:
      WRITE: ${WRITE:-false}
      DAILY_HOUR: ${DAILY_HOUR:-7}
      STATE_PATH: /data/state.json
    volumes:
      - mpp-autopilot-state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mpp-autopilot-state:
    name: mpp-autopilot-state
